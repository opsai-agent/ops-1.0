[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ops-ai"
version = "0.1.0"
description = "OPS: An open-source AI agent with custom-trained Meta LLaMA-based models"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "OPS Team", email = "ops@opensource.ai"}
]
keywords = ["ai", "agent", "llm", "machine-learning", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    # Core LLM
    "transformers>=4.40.0",
    "torch>=2.1.0",
    "accelerate>=0.26.0",
    "sentencepiece>=0.2.0",
    "protobuf>=4.25.0",

    # API & Communication
    "httpx>=0.27.0",
    "websockets>=12.0",
    "aiohttp>=3.9.0",

    # CLI & UI
    "rich>=13.7.0",
    "click>=8.1.0",
    "prompt-toolkit>=3.0.0",
    "textual>=0.60.0",
    "markdown>=3.5.0",

    # Tools
    "duckduckgo-search>=6.0.0",
    "playwright>=1.41.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",

    # Training
    "datasets>=2.17.0",
    "peft>=0.10.0",
    "trl>=0.8.0",
    "bitsandbytes>=0.42.0",
    "safetensors>=0.4.2",

    # Utilities
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "jsonschema>=4.21.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "jinja2>=3.1.0",
    "tiktoken>=0.6.0",
]

[project.optional-dependencies]
desktop = [
    "pyinstaller>=6.0.0",
    "pydantic[email]",
]
training = [
    "wandb>=0.16.0",
    "deepspeed>=0.13.0",
    "flash-attn>=2.5.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]
all = ["ops-ai[desktop,training,dev]"]

[project.scripts]
ops = "ops.cli.main:main"
ops-train = "ops.training.trainer:main"

[project.urls]
Homepage = "https://github.com/ops-ai/ops"
Documentation = "https://docs.ops-ai.dev"
Repository = "https://github.com/ops-ai/ops"
Issues = "https://github.com/ops-ai/ops/issues"
Changelog = "https://github.com/ops-ai/ops/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ops*", "ops_cli*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
